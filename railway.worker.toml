# railway.toml — Configuración de build y deploy para Railway
#
# Este archivo configura el servicio  "worker" (Celery).
#
# Ver README → Deploy en Railway para el procedimiento completo.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "celery -A app.tasks.celery_app worker --loglevel=info --pool=threads --concurrency=6 --beat"
# always + 10 retries: el worker debe estar siempre arriba; los fallos transitorios
# (FTP IGN-Ar lento, red, OOM puntual) no deben dejarlo muerto sin reintentar.
restartPolicyType = "always"
restartPolicyMaxRetries = 10
